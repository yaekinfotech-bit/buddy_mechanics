<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}

main{flex:1;overflow-y:auto;padding:16px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pri{width:100%;min-height:52px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:15px}
.cta{width:100%;min-height:52px;border-radius:14px;background:var(--or);color:var(--ink);font-weight:800;font-size:15px}
.sec{min-height:46px;padding:0 16px;border-radius:12px;background:var(--bl);color:var(--blue);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
h2{font-size:16px;margin:22px 0 10px}

.q{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}

.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bl);color:var(--blue)}
.ib.o{background:var(--ol);color:var(--ord)}
.ib svg{width:22px;height:22px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.tab{white-space:nowrap;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--mut)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 3px;font-size:11px;font-weight:600;text-align:center;min-height:96px;line-height:1.25}
nav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:2px}
nav button{flex:1;min-height:60px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{width:22px;height:22px}nav button.on{color:var(--blue);font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-top:14px}
.srch svg{width:20px;height:20px;color:var(--mut)}
input{width:100%;min-height:48px;border:0;outline:0;background:none;color:var(--ink);font-size:14px}
.f{border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;margin-top:6px}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-top:12px}
small{color:var(--mut)}
.tl>div{display:flex;gap:12px;align-items:center;padding:9px 0;font-size:14px;color:var(--mut)}
.tl>div.d{color:var(--ink);font-weight:700}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}.d .dot{background:var(--blue);border-color:var(--blue)}
.pulse{width:96px;height:96px;border-radius:50%;background:var(--blue);margin:50px auto 24px;animation:p 1.3s infinite}
@keyframes p{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.4);opacity:.1}}
.stars button{font-size:32px;min-width:48px;min-height:48px;color:var(--line)}.stars button.on{color:var(--or)}
.er{font-size:13px;min-height:18px;margin:8px 0;color:#B91C1C}.er.ok{color:#15803D}.f input:disabled{color:var(--mut)}.demo{background:var(--ol);border:1px solid #FFD9B8;border-radius:14px;padding:12px;margin-top:14px;font-size:13px}.logo{width:44px;height:44px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center}.logo svg{width:26px;height:26px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.cc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px}.cc b{font-size:14px}.cc small{font-size:12px;line-height:1.3}
.sm{min-height:38px;padding:0 10px;font-size:12px;border-radius:10px}.act{display:flex;flex-direction:column;gap:6px}
.map{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#EEF3FC}.map svg{display:block;width:100%;height:auto;fill:none}
.ping{transform-box:fill-box;transform-origin:center;animation:pg 1.6s infinite}@keyframes pg{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.4);opacity:0}}
select{width:100%;min-height:46px;border:0;outline:0;background:none;color:var(--ink);font-size:14px}.wp{background:var(--blue);border-radius:28px;height:290px;display:grid;place-items:center;position:relative;overflow:hidden;margin-top:22px}.wp .big{width:150px;height:150px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center}.wp .big svg{width:76px;height:76px;stroke-width:1.5}.wp i{position:absolute;border-radius:50%}.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}.dots b{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots b.on{width:24px;background:var(--blue)}</style></head>

function sendOtp(r){var e=r?LG.e:document.getElementById("em").value.trim().toLowerCase();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){msg("Enter a valid email address.");return}
LG.e=e;OT={c:String(100000+Math.floor(Math.random()*900000)),t:Date.now(),n:0};LG.m="otp";otp()}
function otp(){$('<button class="sec" onclick="LG.m=\'email\';login()">Back</button><h2 style="font-size:22px">Enter the code</h2><div style="color:var(--mut)">Code sent to <b>'+esc(LG.e)+'</b></div><div class="demo">Demo mode: no email is really sent. Your code is <b style="letter-spacing:2px">'+OT.c+'</b>. A live build delivers it to the inbox.</div><label>6-digit code</label><div class="f"><input id="oc" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="letter-spacing:8px;font-size:22px;font-weight:800;text-align:center"></div><div class="er" id="er"></div><button class="pri" onclick="verify()">Verify and continue</button><div style="text-align:center;margin-top:14px"><button class="sec" onclick="sendOtp(1)">Resend code</button></div><small style="display:block;text-align:center;margin-top:12px">Code is valid for 5 minutes. 3 attempts allowed.</small>')}

DB[SES].name=n;DB[SES].phone=p;save();draw()}
